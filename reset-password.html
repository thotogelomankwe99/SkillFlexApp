<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
  <link rel="stylesheet" href="reset-password.css" />

  <!-- Firebase SDKs -->
  <script type="module" src="reset-password.js"></script>
  
</head>
<body>
  <div class="reset-card">
    <h2>Reset Your Password</h2>
    <p><span class="hinting">Lost your password? Please enter your email address to receive a link for reseting new password.</span></p><br>
    <form id="resetForm">
      <label for="email">Email Address<span class="required">*</span></label>
      <input type="email" id="email" placeholder="Enter your email" required />
      <button type="submit">Send Reset Link</button>
    </form>
    <p id="message"></p>
    <a href="login.html" class="login-link">Back to Login</a>
  </div>
</body>
</html>
